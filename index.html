<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf8f3" />
    <meta
      name="description"
      content="Your recipes, saved on this device. A little less planning, a little more cooking."
    />
    <title>Forkcast · Your recipe collection</title>
    <!-- Paints the loading message in the app's colors before the stylesheet and
    bundle arrive, so opening never starts on a blank page. -->
    <style>
      html {
        background: #faf8f3;
      }
      .startup-loading {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #697064;
        background: #faf8f3;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <p class="startup-loading">Opening your recipe collection…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
