name: Check application

on:
  push:
    branches: [main]
  pull_request:

# A newer push replaces an older run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  # Every merge to main must finish: the release workflow follows its result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check:format
      - run: npm run check:rust
      - run: cargo test --workspace

  # The desktop app is tested through its packaged window (WebView2), so these
  # journeys run on Windows. Each Playwright project runs in its own job.
  journeys:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, tablet, browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:prepare
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/

  # The Android app must keep building: an unsigned release APK for the two
  # supported ABIs (see docs/android.md).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37 ndk;27.2.12479018
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri android build --apk --target aarch64 --target x86_64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
