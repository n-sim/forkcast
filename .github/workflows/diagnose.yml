name: Diagnose desktop launch

on:
  push:
    branches: [feat/core-desktop-sync-49-53]

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run test:prepare
      - name: WebView2 runtime
        shell: pwsh
        run: |
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv
          Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv
          Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView' -ErrorAction SilentlyContinue
      - run: npx playwright install chromium
      - name: Smoke journeys
        run: npx playwright test tests/smoke.spec.ts tests/recipes.spec.ts --project=desktop --retries=0 --max-failures=3
