[package]
name = "tauri-plugin-forkcast-secure-store"
version = "0.1.0"
edition = "2024"
publish = false
description = "Keystore-backed storage for session tokens, reachable only from native code."
links = "tauri-plugin-forkcast-secure-store"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
forkcast-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
