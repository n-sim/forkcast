[package]
name = "forkcast-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.5"
base64 = "0.22"
forkcast-recipe-domain = { path = "../recipe-domain" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
